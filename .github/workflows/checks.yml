# Runs the app's unit tests and the Edge Function regression checks (pricing, refunds, modify rules) on every push and pull request.
# A red cross next to a commit means a pricing/refund rule no longer behaves as the checks expect - see supabase/tests/edge-functions/README.md.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: App unit tests
        run: npx jest
      - name: Edge Function regression checks
        run: npm run test:edge
