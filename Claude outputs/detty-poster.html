/* ─────────────────────────────────────────────────────────────────────
   WOPECAR — DETTY DECEMBER POSTER   1080 × 1527 (A-series portrait)
   Built on the house poster template: hairline → logo → wheel-framed
   circular photo → FTGP lockup → campaign line → body → CTA.

   MESSAGING taken from Detty December v1:
     "Home for Detty December"
     "Book before you fly. Pick up your car when you land in Accra."

   WHAT CHANGED FROM THE REFERENCE, AND WHY
   · Secondary line is NOT teal. Teal #3EB6BA on the tan ground measures
     1.33:1 — the reference poster's "RENT A CAR" is effectively invisible
     to anyone with reduced contrast sensitivity, and close to invisible in
     print. Replaced with navy-dark #0E3541 (4.03:1) at display size.
   · Body copy is ink #16232A (4.94:1), not white. White on tan is 3.25:1 —
     fine for display sizes, a fail at body size.
   · CTA is navy-dark, not orange. Orange #D07E5A on a tan ground separates
     at only 3.12:1 — an orange button on this ground does not read as a
     button. The warm accent is already carried by the ground itself.
   · Teal is kept where it works: the two wheel arcs. Those are decorative
     shapes, not text, and the hue split against tan reads clearly.

   ASSETS — all placed as artwork, never re-typed
   · wopecar-logo-reverse.svg   (white, directly on the tan, no container)
   · wheel-teal.svg             (disc used as the photo clip; arcs kept)
   · ftgp-flat-white.svg        (the tagline lockup, flat set)

   TYPE — no DanburyCaps anywhere in this file. The hero line is the FTGP
   lockup artwork, so no display face is substituted for it. The campaign
   line and body are Source Sans 3, which is the real brand body face.
   ───────────────────────────────────────────────────────────────────── */
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#4a4a4a;display:flex;justify-content:center;padding:28px;
       font-family:'Source Sans 3',Helvetica,Arial,sans-serif}

  .poster{width:1080px;height:1527px;position:relative;overflow:hidden;
          background:#B8826F;display:flex;flex-direction:column}

  /* Template device: a hairline dropping from the top edge to the logo */
  .rule{position:absolute;left:134px;top:0;width:2px;height:104px;
        background:#FFFFFF;opacity:.85}

  .head{padding:104px 134px 0}
  .logo{width:290px;height:auto;display:block}

  /* ── Wheel frame: the photo sits INSIDE the wheel ── */
  .wheelwrap{margin-top:34px;display:flex;justify-content:center}
  .wheelwrap svg{width:624px;height:auto;display:block;overflow:visible}

  /* ── Copy block ── */
  .copy{margin-top:auto;padding:0 134px 84px}

  .ftgp{width:740px;height:auto;display:block;margin-bottom:36px}

  /* Campaign line — display size, so 3:1 is the gate and both halves clear it */
  .line{font-size:46px;line-height:1.02;font-weight:700;letter-spacing:.005em;
        text-transform:uppercase}
  .line .a{color:#0E3541}   /* 4.03:1 on tan */
  .line .b{color:#FFFFFF}   /* 3.25:1 on tan, display size only */

  .sub{margin-top:26px;font-size:26px;line-height:1.5;color:#16232A;   /* 4.94:1 */
       max-width:30ch;font-weight:400}

  .foot{margin-top:38px;display:flex;align-items:center;gap:28px}
  .cta{background:#0E3541;color:#FFFFFF;border-radius:100px;
       padding:20px 42px;font-size:28px;font-weight:700;white-space:nowrap}
  .site{font-size:26px;font-weight:700;color:#16232A;letter-spacing:.02em}
</style>
</head>
